project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - methods.qmd
    - results.qmd
    - interactive.qmd

website:
  title: "BLM Protests & Voter Turnout"
  description: "Estimating the causal effect of Black Lives Matter protests on voter turnout using instrumental variables and spatial regression — Georgia proof of concept."
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: methods.qmd
        text: Methods
      - href: results.qmd
        text: Results
      - href: interactive.qmd
        text: Explore
    right:
      - icon: github
        href: https://github.com
        aria-label: GitHub

format:
  html:
    theme:
      light: cosmo
    code-fold: true
    code-tools: true
    toc: true
    toc-depth: 3
    fig-align: center
    fig-width: 8
    fig-height: 6
    html-math-method: katex
